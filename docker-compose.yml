services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      SCRAPER_OUTPUT_PATH: /app/data/raw/collected_documents.jsonl
      HF_HOME: /app/data/model-cache
    volumes:
      - chroma_data:/app/data/chroma
      - model_cache:/app/data/model-cache
      - ./data/raw:/app/data/raw
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  chroma_data:
  model_cache:
